<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Web Dinámica con Base de Datos</title>
    <style>
        body { font-family: sans-serif; background: #fff5e6; text-align: center; padding: 50px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { margin: 20px auto; border-collapse: collapse; width: 80%; }
        th, td { border: 1px solid #ff9f43; padding: 10px; }
        th { background: #ff9f43; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Datos desde PostgreSQL en Render</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre Registrado</th>
                </tr>
            </thead>
            <tbody>
                {% for visita in visitas %}
                <tr>
                    <td>{{ visita[0] }}</td>
                    <td>{{ visita[1] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
